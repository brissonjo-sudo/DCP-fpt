name: Validation du skill DCP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Les preuves restent liées aux octets de leur commit source.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/package_skill.py
